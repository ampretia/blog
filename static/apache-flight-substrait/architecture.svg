<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" width="780" height="410" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13">
  <title id="t">Client, Flight SQL, execution engines and a central catalog</title>
  <desc id="d">A client sends a Substrait plan and session options to a Flight SQL endpoint, which passes them to one of several execution engines. The engines return Arrow record batches to the client with DoGet. A central catalog supplies name hints to the client and resolves names for the engines.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82d4"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c5cd8"/>
    </marker>
  </defs>

  <rect width="780" height="410" fill="#ffffff"/>

  <!-- Execution engines group -->
  <rect x="590" y="100" width="170" height="250" rx="4" fill="none" stroke="#57606a" stroke-dasharray="4 3"/>
  <text x="675" y="120" text-anchor="middle" fill="#57606a" font-size="12">Execution engines</text>

  <!-- Boxes -->
  <rect x="330" y="15" width="160" height="60" rx="4" fill="#f7f8fa" stroke="#7c5cd8"/>
  <text x="410" y="40" text-anchor="middle" fill="#1f2328" font-weight="600">Central catalog</text>
  <text x="410" y="59" text-anchor="middle" fill="#57606a" font-size="12">name mapping</text>

  <rect x="20" y="170" width="140" height="90" rx="4" fill="#f7f8fa" stroke="#57606a"/>
  <text x="90" y="212" text-anchor="middle" fill="#1f2328" font-weight="600">Client</text>
  <text x="90" y="231" text-anchor="middle" fill="#57606a" font-size="12">product</text>

  <rect x="330" y="170" width="160" height="90" rx="4" fill="#f7f8fa" stroke="#3b82d4"/>
  <text x="410" y="212" text-anchor="middle" fill="#1f2328" font-weight="600">Flight SQL</text>
  <text x="410" y="231" text-anchor="middle" fill="#57606a" font-size="12">GetFlightInfo</text>

  <rect x="605" y="140" width="140" height="60" rx="4" fill="#f7f8fa" stroke="#57606a"/>
  <text x="675" y="175" text-anchor="middle" fill="#1f2328" font-weight="600">Engine A</text>

  <rect x="605" y="250" width="140" height="60" rx="4" fill="#f7f8fa" stroke="#57606a"/>
  <text x="675" y="285" text-anchor="middle" fill="#1f2328" font-weight="600">Engine B</text>

  <!-- Client to Flight SQL -->
  <line x1="160" y1="200" x2="328" y2="200" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="192" text-anchor="middle" fill="#1f2328" font-size="12">Substrait plan (what)</text>
  <line x1="160" y1="238" x2="328" y2="238" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="256" text-anchor="middle" fill="#1f2328" font-size="12">Session options (where)</text>

  <!-- Flight SQL to engines -->
  <line x1="490" y1="215" x2="603" y2="172" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="215" x2="603" y2="278" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Results back to client -->
  <polyline points="675,350 675,385 90,385 90,264" fill="none" stroke="#3b82d4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="377" text-anchor="middle" fill="#1f2328" font-size="12">DoGet: Arrow record batches</text>

  <!-- Catalog -->
  <polyline points="330,45 90,45 90,168" fill="none" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-dash)"/>
  <text x="210" y="37" text-anchor="middle" fill="#57606a" font-size="12">hints</text>
  <polyline points="490,45 675,45 675,98" fill="none" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-dash)"/>
  <text x="582" y="37" text-anchor="middle" fill="#57606a" font-size="12">resolves names</text>
</svg>
